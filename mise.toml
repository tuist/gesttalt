[tools]
rust = "1.88.0"
java = "17"
"github:tuist/once" = { version = "latest", exe = "once" }
android-sdk = "21.0"
kotlin = "2.1.0"

[env]
ANDROID_NDK_HOME = "{{env.HOME}}/.local/share/mise/installs/android-sdk/21.0/ndk/27.3.13750724"
_.path = [
  "{{env.HOME}}/.local/share/mise/installs/android-sdk/21.0/platform-tools",
]

[tasks."once:snapshot"]
description = "Build a Once snapshot with Android application fixes"
outputs = ["build/tools/once/538bab10210ce8177e31e3d2e343f38fce265f35/once"]
run = '''
set -eu
revision="538bab10210ce8177e31e3d2e343f38fce265f35"
install_dir="$PWD/build/tools/once/$revision"
once_bin="$install_dir/once"
if [ -x "$once_bin" ]; then
  exit 0
fi
tmp_dir="$(mktemp -d)"
trap 'rm -rf "$tmp_dir"' EXIT
git clone --filter=blob:none https://github.com/tuist/fabrik "$tmp_dir/fabrik"
git -C "$tmp_dir/fabrik" checkout "$revision"
mise install rust@1.96.0
mise exec rust@1.96.0 -- cargo build \
  --manifest-path "$tmp_dir/fabrik/Cargo.toml" \
  --package once-cli \
  --bin once \
  --release \
  --locked
mkdir -p "$install_dir"
cp "$tmp_dir/fabrik/target/release/once" "$once_bin"
'''

[tasks."toolchains:ios"]
description = "Install Rust targets used by the iOS Once targets"
run = "rustup target add aarch64-apple-ios-sim"

[tasks."toolchains:android"]
description = "Install Android packages and Rust targets used by the Android Once targets"
run = '''
set -eu
responses="${TMPDIR:-/tmp}/gesttalt-android-sdk-licenses.$$"
trap 'rm -f "$responses"' EXIT
awk 'BEGIN { for (i = 0; i < 200; i++) print "y" }' > "$responses"
sdkmanager --licenses < "$responses" >/dev/null || true
sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" < "$responses"
rustup target add aarch64-linux-android
mkdir -p "$HOME/.android"
if [ ! -f "$HOME/.android/debug.keystore" ]; then
  keytool -genkeypair \
    -keystore "$HOME/.android/debug.keystore" \
    -storepass android \
    -keypass android \
    -alias androiddebugkey \
    -dname "CN=Android Debug,O=Android,C=US" \
    -keyalg RSA \
    -keysize 2048 \
    -validity 10000 \
    -storetype JKS >/dev/null 2>&1
fi
'''

[tasks."build:shared:ios"]
description = "Build the Rust library for iOS through Once"
depends = ["toolchains:ios"]
run = "once build SharedRustApple"

[tasks."build:shared:android"]
description = "Build the Rust library for Android through Once"
depends = ["toolchains:android", "once:snapshot"]
run = '"${ONCE_BIN:-$PWD/build/tools/once/538bab10210ce8177e31e3d2e343f38fce265f35/once}" build SharedRustAndroid'

[tasks."build:ios"]
description = "Build the Swift iOS app through Once"
depends = ["build:shared:ios"]
run = "once build AppleApp"

[tasks."build:android"]
description = "Build the Kotlin Android app through Once"
depends = ["build:shared:android"]
run = '"${ONCE_BIN:-$PWD/build/tools/once/538bab10210ce8177e31e3d2e343f38fce265f35/once}" build AndroidApp'

[tasks.build]
description = "Build iOS and Android"
depends = ["build:ios", "build:android"]
