name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-workflow-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0
  MISE_VERSION: "2026.4.18"
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check-releases:
    name: Check for releasable changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should-release: ${{ steps.gesttalt-check.outputs.should-release }}
      next-version: ${{ steps.gesttalt-check.outputs.next-version }}
      next-version-number: ${{ steps.gesttalt-check.outputs.next-version-number }}
      latest-version: ${{ steps.gesttalt-check.outputs.latest-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "rust git-cliff"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}

      - name: Check Gesttalt for releasable changes
        id: gesttalt-check
        run: |
          set -euo pipefail

          LATEST_VERSION=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)

          if [ -n "$LATEST_VERSION" ]; then
            CHANGELOG=$(git cliff --config cliff.toml --repository "." 2>/dev/null -- "${LATEST_VERSION}..HEAD" || true)
          else
            CHANGELOG=$(git cliff --config cliff.toml --repository "." 2>/dev/null || true)
          fi

          if echo "$CHANGELOG" | sed -n '/<!-- RELEASE NOTES START -->/,/<!-- generated by git-cliff -->/p' | grep -qE '^\*'; then
            if [ -n "$LATEST_VERSION" ]; then
              NEXT_VERSION_NUMBER=$(git cliff --config cliff.toml --repository "." --bumped-version 2>/dev/null -- "${LATEST_VERSION}..HEAD")
            else
              NEXT_VERSION_NUMBER=$(git cliff --config cliff.toml --repository "." --bumped-version 2>/dev/null)
            fi
          else
            NEXT_VERSION_NUMBER="${LATEST_VERSION#v}"
          fi

          if [ -z "$LATEST_VERSION" ] && [ -z "$NEXT_VERSION_NUMBER" ]; then
            NEXT_VERSION_NUMBER="0.1.0"
          fi

          NEXT_VERSION="v${NEXT_VERSION_NUMBER#v}"

          echo "Latest Gesttalt version: ${LATEST_VERSION:-none}"
          echo "Next Gesttalt version: $NEXT_VERSION"

          if [ -z "$LATEST_VERSION" ]; then
            if echo "$CHANGELOG" | sed -n '/<!-- RELEASE NOTES START -->/,/<!-- generated by git-cliff -->/p' | grep -qE '^\*'; then
              echo "First Gesttalt release: $NEXT_VERSION"
              echo "should-release=true" >> "$GITHUB_OUTPUT"
            else
              echo "No Gesttalt release notes found"
              echo "should-release=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$NEXT_VERSION" = "$LATEST_VERSION" ]; then
            echo "No Gesttalt version change detected"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n' "${LATEST_VERSION#v}" "${NEXT_VERSION#v}" | sort -V | head -n1)" = "${NEXT_VERSION#v}" ]; then
            echo "ERROR: Next version ($NEXT_VERSION) is older than latest version ($LATEST_VERSION)"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Gesttalt version bump detected: $LATEST_VERSION -> $NEXT_VERSION"
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

          echo "latest-version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "next-version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "next-version-number=${NEXT_VERSION#v}" >> "$GITHUB_OUTPUT"

  prepare-release:
    name: Prepare release metadata
    needs: check-releases
    if: needs.check-releases.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release-notes: ${{ steps.release-notes.outputs.RELEASE_NOTES }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "rust git-cliff"
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}

      - name: Get release notes
        id: release-notes
        run: |
          set -euo pipefail

          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_OUTPUT"
          if [ -n "${{ needs.check-releases.outputs.latest-version }}" ]; then
            git cliff --config cliff.toml --repository "." 2>/dev/null -- "${{ needs.check-releases.outputs.latest-version }}..HEAD" | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2 >> "$GITHUB_OUTPUT"
          else
            git cliff --config cliff.toml --repository "." 2>/dev/null | sed -n '/<!-- RELEASE NOTES START -->/,$p' | tail -n +2 >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update workspace version
        run: |
          set -euo pipefail
          VERSION_NUMBER="${{ needs.check-releases.outputs.next-version-number }}"
          sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION_NUMBER}\"/" Cargo.toml
          mise exec -- cargo generate-lockfile

      - name: Update CHANGELOG.md
        run: |
          set -euo pipefail
          if [ -n "${{ needs.check-releases.outputs.latest-version }}" ]; then
            git cliff --config cliff.toml --repository "." --bump -o CHANGELOG.md 2>/dev/null -- "${{ needs.check-releases.outputs.latest-version }}..HEAD"
          else
            git cliff --config cliff.toml --repository "." --bump -o CHANGELOG.md 2>/dev/null
          fi

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
          retention-days: 1

  build:
    name: Build ${{ matrix.platform }}
    needs:
      - check-releases
      - prepare-release
    if: needs.check-releases.outputs.should-release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            binary: gesttalt
            archive: tar.gz
          - platform: macos-aarch64
            os: macos-latest
            binary: gesttalt
            archive: tar.gz
          - platform: windows-x86_64
            os: windows-latest
            binary: gesttalt.exe
            archive: zip

    steps:
      - uses: actions/checkout@v6

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .

      - name: Install GPUI Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang \
            libasound2-dev \
            libfontconfig1-dev libfreetype6-dev \
            libssl-dev libzstd-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev mesa-vulkan-drivers

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          cache: "false"
          github_token: ${{ env.MISE_GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-${{ matrix.platform }}

      - name: Build release binary
        run: cargo build -p gesttalt --release --locked

      - name: Package Linux tarball
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-releases.outputs.next-version }}"
          mkdir -p \
            dist/package \
            dist/package/share/applications \
            dist/package/share/icons/hicolor/512x512/apps
          cp "target/release/${{ matrix.binary }}" dist/package/
          cp README.md dist/package/README.md 2>/dev/null || true
          sed \
            -e 's#$APP_NAME#Gesttalt#g' \
            -e 's#$APP_CLI#gesttalt#g' \
            -e 's#$APP_ICON#dev.tuist.gesttalt#g' \
            -e 's#$APP_ID#dev.tuist.gesttalt#g' \
            crates/gesttalt/resources/gesttalt.desktop.in \
            > dist/package/share/applications/dev.tuist.gesttalt.desktop
          cp \
            crates/gesttalt/resources/app-icon.png \
            dist/package/share/icons/hicolor/512x512/apps/dev.tuist.gesttalt.png
          tar -czf "dist/gesttalt-${VERSION}-${{ matrix.platform }}.tar.gz" -C dist/package .

      - name: Package macOS app bundle
        if: matrix.platform == 'macos-aarch64'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-releases.outputs.next-version }}"
          VERSION_NUMBER="${{ needs.check-releases.outputs.next-version-number }}"
          APP_DIR="dist/package/Gesttalt.app"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"
          cp "target/release/${{ matrix.binary }}" "${APP_DIR}/Contents/MacOS/gesttalt"
          cp crates/gesttalt/resources/app-icon.icns "${APP_DIR}/Contents/Resources/app-icon.icns"
          chmod +x "${APP_DIR}/Contents/MacOS/gesttalt"
          cat > "${APP_DIR}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>gesttalt</string>
            <key>CFBundleIdentifier</key>
            <string>dev.tuist.gesttalt</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleIconFile</key>
            <string>app-icon.icns</string>
            <key>CFBundleName</key>
            <string>Gesttalt</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION_NUMBER}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION_NUMBER}</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          echo "APPL????" > "${APP_DIR}/Contents/PkgInfo"
          tar -czf "dist/gesttalt-${VERSION}-${{ matrix.platform }}.tar.gz" -C dist/package Gesttalt.app

      - name: Package zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ needs.check-releases.outputs.next-version }}"
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" dist/package/
          if (Test-Path README.md) {
            Copy-Item README.md dist/package/README.md
          }
          Compress-Archive -Path dist/package/* -DestinationPath "dist/gesttalt-$version-${{ matrix.platform }}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: gesttalt-${{ matrix.platform }}
          path: dist/gesttalt-*
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs:
      - check-releases
      - prepare-release
      - build
    if: |
      always() &&
      needs.check-releases.outputs.should-release == 'true' &&
      needs.prepare-release.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum gesttalt-* > SHASUMS256.txt
          sha512sum gesttalt-* > SHASUMS512.txt

      - name: Validate release tag is available
        run: |
          set -euo pipefail
          TAG="${{ needs.check-releases.outputs.next-version }}"
          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi

      - name: Commit release metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "Release Gesttalt ${{ needs.check-releases.outputs.next-version }}"
          git push origin HEAD:main

      - name: Create Gesttalt GitHub Release with artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          prerelease: false
          repository: tuist/gesttalt
          name: Gesttalt ${{ needs.check-releases.outputs.next-version-number }}
          tag_name: ${{ needs.check-releases.outputs.next-version }}
          target_commitish: main
          body: ${{ needs.prepare-release.outputs.release-notes }}
          files: |
            dist/gesttalt-*
            dist/SHASUMS256.txt
            dist/SHASUMS512.txt
